<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Notifikasi Sistem</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.6; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #ffffff;">
        <h2 style="color: #0056b3; margin-top: 0;">Halo, {{Nama}}!</h2>
        
        <p>Ini adalah email template sederhana yang digunakan untuk pengujian (testing) pengiriman email melalui <strong>Ogya.Smtp.Utils</strong>.</p>
        
        <div style="background-color: #f9f9f9; padding: 15px; border-left: 4px solid #0056b3; margin: 20px 0;">
            <p style="margin: 0;"><strong>Pesan:</strong><br/>
            {{Pesan}}</p>
        </div>
        
        <p>Jika Anda memiliki pertanyaan, jangan ragu untuk membalas email ini.</p>
        
        <br>
        <p style="font-size: 0.9em; color: #777777; margin-bottom: 0;">
            Salam hangat,<br>
            <strong>Tim Ogya</strong>
        </p>
    </div>
</body>
</html>
